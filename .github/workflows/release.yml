name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Verify Release Integrity (Tag vs Manifests and Changelog)
  # =========================================================================
  verify:
    name: Verify Release Tag and Notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      pep440: ${{ steps.check.outputs.pep440 }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every tag: the Latest-release decision compares this
          # tag against all other v* tags, and reachability needs the branch refs.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Tag Is Reachable from main or Its Release Branch
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a SemVer vX.Y.Z tag."
            exit 1
          fi
          LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag commit $(git rev-parse --short HEAD) is reachable from origin/main."
            exit 0
          fi

          RELEASE_REF="refs/remotes/origin/release/${LINE}"
          if git rev-parse -q --verify "${RELEASE_REF}" >/dev/null \
            && git merge-base --is-ancestor HEAD "${RELEASE_REF}"; then
            echo "Tag commit $(git rev-parse --short HEAD) is reachable from origin/release/${LINE}."
            exit 0
          fi

          echo "::error::Tag '${GITHUB_REF_NAME}' points to a commit that is not reachable from origin/main or origin/release/${LINE}; refusing to publish."
          exit 1

      - name: Verify Tag against Cargo.toml and CHANGELOG.md
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # PEP 440 version maturin gives the wheel (0.5.0-alpha.1 -> 0.5.0a1).
          # The install smoke tests pin this so uv can never resolve a PyPI release.
          PEP440_VERSION=$(python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from check_version_sync import cargo_to_pep440
          print(cargo_to_pep440('${VERSION}'))
          ")
          echo "pep440=${PEP440_VERSION}" >> "${GITHUB_OUTPUT}"

          # Check if tag is pre-release (contains hyphen, e.g. 0.4.0-alpha.7)
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "Checking Cargo.toml version equals '${VERSION}'..."
          CARGO_VERSION=$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))
          print(data['workspace']['package']['version'])
          ")

          if [[ "${CARGO_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Tag '${TAG}' does not match workspace Cargo.toml version '${CARGO_VERSION}'!"
            exit 1
          fi

          echo "Checking CHANGELOG.md for dated section '[${VERSION}]'..."
          python3 scripts/check_changelog.py --format
          NOTES=$(python3 scripts/check_changelog.py --extract "${VERSION}")
          if [[ -z "${NOTES}" ]]; then
            echo "::error::No release notes found in CHANGELOG.md for version '${VERSION}'!"
            exit 1
          fi

          echo "Checking Cargo.toml and pyproject.toml version lockstep..."
          python3 scripts/check_version_sync.py

          echo "Release verification passed for ${TAG}."

      - name: Determine Whether This Tag Is the Latest Release
        id: latest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mapfile -t TAGS < <(git tag --list 'v*')
          LATEST=$(python3 - "${VERSION}" "${TAGS[@]}" <<'PY'
          import re
          import sys

          SEMVER_RE = re.compile(
              r"^(?P<major>0|[1-9][0-9]*)\.(?P<minor>0|[1-9][0-9]*)\.(?P<patch>0|[1-9][0-9]*)"
              r"(?:-(?P<pre>[0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$"
          )


          def parse(version):
              match = SEMVER_RE.fullmatch(version)
              if match is None:
                  return None
              core = (int(match["major"]), int(match["minor"]), int(match["patch"]))
              pre = match["pre"]
              if pre is None:
                  return core + ((1, ()),)
              identifiers = []
              for identifier in pre.split("."):
                  if identifier.isdigit():
                      identifiers.append((0, int(identifier)))
                  else:
                      identifiers.append((1, identifier))
              return core + ((0, tuple(identifiers)),)


          version = sys.argv[1]
          current = parse(version)
          # Pre-releases are never the Latest release, and an invalid tag is
          # handled by the manifest/changelog verification above.
          if current is None or "-" in version:
              print("false")
              sys.exit(0)
          for tag in sys.argv[2:]:
              other = parse(tag[1:]) if tag.startswith("v") else None
              if other is not None and other > current:
                  print("false")
                  sys.exit(0)
          print("true")
          PY
          )
          echo "Tag ${GITHUB_REF_NAME}: make_latest=${LATEST}"
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"

  # =========================================================================
  # 2. Build Source Distribution (sdist)
  # =========================================================================
  build-sdist:
    name: Build Source Distribution
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/*

  # =========================================================================
  # 3. Build Multi-Platform Native Wheels (abi3)
  # =========================================================================
  build-wheels:
    name: Build Wheels (${{ matrix.os }}, ${{ matrix.target }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: false

      - name: Verify Linux Wheel manylinux Tag
        if: contains(matrix.target, 'linux')
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          expected = "manylinux_2_28"
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("No wheels found in dist/")
          for wheel in wheels:
              print(f"Checking {wheel.name}")
              if expected not in wheel.name:
                  sys.exit(
                      f"ERROR: {wheel.name} does not carry the expected {expected} tag"
                  )
          print(f"All {len(wheels)} Linux wheel(s) carry the {expected} tag.")
          PY

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*

  # =========================================================================
  # 3b. Verify Linux Wheel Tags and Base-Only Install
  # =========================================================================
  verify-wheels:
    name: Verify Wheels (Py ${{ matrix.python-version }})
    needs: [verify, build-wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux x86_64 Wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-ubuntu-latest-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify Downloaded Linux Wheel Tag
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          expected = "manylinux_2_28"
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("No Linux x86_64 wheel found in dist/")
          for wheel in wheels:
              print(f"Checking {wheel.name}")
              if expected not in wheel.name:
                  sys.exit(f"ERROR: {wheel.name} does not carry the expected {expected} tag")
          print(f"All {len(wheels)} Linux x86_64 wheel(s) carry the {expected} tag.")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Wheel into Fresh Environment (No Extras)
        run: |
          uv venv --python ${{ matrix.python-version }} "${RUNNER_TEMP}/voyager-base"
          uv pip install --python "${RUNNER_TEMP}/voyager-base/bin/python" dist/*.whl

      - name: Run Base-Install Smoke Test
        run: |
          "${RUNNER_TEMP}/voyager-base/bin/python" -I scripts/smoke_base_install.py

  # =========================================================================
  # 3c. Build Multi-Platform CLI Binaries (voyager; voy is an alias in the archive)
  # =========================================================================
  build-cli:
    name: Build CLI Binaries (${{ matrix.target }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl Toolchain (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # The -gnu binaries link against glibc 2.28 (the manylinux_2_28 baseline of
      # the wheels) through cargo-zigbuild, so they run on Debian 10+, Ubuntu
      # 20.04+ and RHEL 8+ instead of requiring the runner's newer glibc.
      # zigbuild also cross-links aarch64 without a separate cross toolchain.
      - name: Install cargo-zigbuild (Linux gnu)
        if: endsWith(matrix.target, '-linux-gnu')
        run: pipx install cargo-zigbuild==0.24.1

      # cargo-zigbuild shells out to `zig`; the pipx package only ships it in its
      # isolated environment, so a standalone Zig on PATH is still required.
      # 0.17.0 is the release cargo-zigbuild 0.24.1 tests against and its
      # `zig cc` supports the -gnu.2.28 glibc suffix used below.
      - name: Install Zig (Linux gnu)
        if: endsWith(matrix.target, '-linux-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.0"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI Binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          if [[ "${TARGET}" == *-linux-gnu ]]; then
            # The .2.28 suffix selects the glibc version to link against; the
            # output still lands in target/<target>/release.
            cargo zigbuild --release --locked -p voyager-cli --target "${TARGET}.2.28"
          else
            cargo build --release --locked -p voyager-cli --target "${TARGET}"
          fi

      - name: Verify glibc Baseline (Linux gnu)
        if: endsWith(matrix.target, '-linux-gnu')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          newest=$(readelf --dyn-syms -W "target/${TARGET}/release/voyager" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "voyager: newest glibc symbol ${newest}"
          [[ "$(printf '%s\n' "${newest#GLIBC_}" 2.28 | sort -V | tail -1)" == "2.28" ]]

      - name: Verify Static Linking (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          file "target/${TARGET}/release/voyager"
          file "target/${TARGET}/release/voyager" | grep -q 'static'

      - name: Package CLI Archive (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          PKG_DIR="voyager-cli-v${VERSION}-${TARGET}"
          STAGE="stage/${PKG_DIR}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/voyager" "${STAGE}/"
          # One binary: `voy` is a relative symlink, which tar keeps as a link.
          ln -s voyager "${STAGE}/voy"
          cp LICENSE-MIT LICENSE-APACHE "${STAGE}/"
          cp crates/voyager-cli/README.md "${STAGE}/README.md"
          tar -C stage -czf "dist/${PKG_DIR}.tar.gz" "${PKG_DIR}"

      - name: Package CLI Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $pkgDir = "voyager-cli-v$env:VERSION-$env:TARGET"
          $stage = "stage\$pkgDir"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\$env:TARGET\release\voyager.exe", "LICENSE-MIT", "LICENSE-APACHE" -Destination $stage
          # One binary: zip has no symlinks, so `voy` is a shim that runs the
          # voyager.exe next to it with the same arguments and exit code.
          Set-Content -Path "$stage\voy.cmd" -Value "@`"%~dp0voyager.exe`" %*`r`n" -NoNewline -Encoding ascii
          Copy-Item "crates\voyager-cli\README.md" -Destination "$stage\README.md"
          Compress-Archive -Path $stage -DestinationPath "dist\$pkgDir.zip" -Force

      - name: Upload CLI Archive Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/voyager-cli-*

  # =========================================================================
  # 3d. Smoke Test Unpacked CLI Archives
  # =========================================================================
  smoke-cli:
    name: Smoke Test CLI (${{ matrix.target }})
    needs: [verify, build-cli]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Download CLI Archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist

      - name: Install QEMU User Emulation (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static libc6-arm64-cross

      - name: Unpack and Smoke Test CLI Archive (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          PKG_DIR="voyager-cli-v${VERSION}-${TARGET}"
          mkdir -p unpack
          tar -xzf "dist/${PKG_DIR}.tar.gz" -C unpack
          BIN_DIR="unpack/${PKG_DIR}"
          test -f "${BIN_DIR}/LICENSE-MIT"
          test -f "${BIN_DIR}/LICENSE-APACHE"
          test -f "${BIN_DIR}/README.md"

          run_bin() {
            if [[ "${TARGET}" == "aarch64-unknown-linux-gnu" ]]; then
              qemu-aarch64-static -L /usr/aarch64-linux-gnu "$@"
            elif [[ "${TARGET}" == "x86_64-apple-darwin" ]]; then
              arch -x86_64 "$@"
            else
              "$@"
            fi
          }

          if [[ "${TARGET}" == "x86_64-apple-darwin" ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::notice::Rosetta is not available on this macOS arm64 runner; skipping x86_64 execution."
            file "${BIN_DIR}/voyager"
            test -L "${BIN_DIR}/voy"
            exit 0
          fi

          test -L "${BIN_DIR}/voy"
          [[ "$(readlink "${BIN_DIR}/voy")" == "voyager" ]]
          VOYAGER_VER=$(run_bin "${BIN_DIR}/voyager" --version)
          VOY_VER=$(run_bin "${BIN_DIR}/voy" --version)
          echo "voyager --version: ${VOYAGER_VER}"
          echo "voy --version: ${VOY_VER}"
          [[ "${VOYAGER_VER}" == "voyager ${VERSION}" ]]
          [[ "${VOY_VER}" == "voyager ${VERSION}" ]]
          run_bin "${BIN_DIR}/voyager" --help >/dev/null

      - name: Unpack and Smoke Test CLI Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $pkgDir = "voyager-cli-v$env:VERSION-$env:TARGET"
          Expand-Archive -Path "dist\$pkgDir.zip" -DestinationPath unpack -Force
          $binDir = "unpack\$pkgDir"
          foreach ($req in @("voyager.exe", "voy.cmd", "LICENSE-MIT", "LICENSE-APACHE", "README.md")) {
            if (-not (Test-Path "$binDir\$req")) { throw "Missing $req in unpacked archive" }
          }
          $voyagerVer = (& "$binDir\voyager.exe" --version).Trim()
          $voyVer = (& "$binDir\voy.cmd" --version).Trim()
          Write-Host "voyager --version: $voyagerVer"
          Write-Host "voy --version: $voyVer"
          if ($voyagerVer -ne "voyager $env:VERSION") { throw "Unexpected voyager version: $voyagerVer" }
          if ($voyVer -ne "voyager $env:VERSION") { throw "Unexpected voy version: $voyVer" }
          & "$binDir\voyager.exe" --help | Out-Null

  # =========================================================================
  # 3e. Attest CLI Archives (Build Provenance)
  # =========================================================================
  attest-cli:
    name: Attest CLI Archives
    needs: [verify, build-cli, smoke-cli]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download CLI Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/voyager-cli-*"

  # =========================================================================
  # 3f. Build Multi-Platform voyager-cli Python Wheels (bindings = "bin")
  # =========================================================================
  build-cli-wheels:
    name: Build CLI Wheels (${{ matrix.os }}, ${{ matrix.target }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build CLI Wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/cli
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --bindings bin --out dist
          sccache: false

      - name: Verify Linux CLI Wheel Compatibility Tag
        if: contains(matrix.target, 'linux')
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          target = os.environ["MATRIX_TARGET"]
          expected = "musllinux_1_2" if "musl" in target else "manylinux_2_28"
          wheels = sorted(pathlib.Path("packages/cli/dist").glob("*.whl"))
          if not wheels:
              sys.exit("No CLI wheels found in packages/cli/dist/")
          for wheel in wheels:
              print(f"Checking {wheel.name}")
              if expected not in wheel.name:
                  sys.exit(
                      f"ERROR: {wheel.name} does not carry the expected {expected} tag"
                  )
          print(f"All {len(wheels)} Linux CLI wheel(s) carry the {expected} tag.")
          PY

      - name: Upload CLI Wheel Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: packages/cli/dist/*

  # =========================================================================
  # 3g. Verify voyager-ogm[cli] Wheel Install
  # =========================================================================
  verify-cli-wheel:
    name: Verify CLI Wheel Install
    needs: [verify, build-wheels, build-cli-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux x86_64 Wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-ubuntu-latest-x86_64-unknown-linux-gnu
          path: dist

      - name: Download Linux x86_64 CLI Wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-wheels-ubuntu-latest-x86_64-unknown-linux-gnu
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install voyager-ogm[cli] from Local Wheels and Smoke Test
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PEP440_VERSION: ${{ needs.verify.outputs.pep440 }}
        run: |
          set -euo pipefail
          uv python install 3.12
          uv venv --python 3.12 "${RUNNER_TEMP}/voyager-cli-venv"
          # Pin the locally built version and allow pre-releases: an unpinned
          # resolve ignores the pre-release wheel in dist/ and picks a stable
          # PyPI release, which has no `cli` extra.
          uv pip install --python "${RUNNER_TEMP}/voyager-cli-venv/bin/python" --find-links dist --prerelease=allow "voyager-ogm[cli]==${PEP440_VERSION}"
          VOYAGER_VER=$("${RUNNER_TEMP}/voyager-cli-venv/bin/voyager" --version)
          [[ "${VOYAGER_VER}" == "voyager ${VERSION}" ]]
          "${RUNNER_TEMP}/voyager-cli-venv/bin/voyager" --help >/dev/null

  # =========================================================================
  # 4. GitHub Release Creation
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [verify, build-sdist, build-wheels, verify-wheels, build-cli, smoke-cli, attest-cli, build-cli-wheels, verify-cli-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Built Wheel Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download Built CLI Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && LC_ALL=C sha256sum * > ../SHA256SUMS)
          mv SHA256SUMS dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Extract Release Notes
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 scripts/check_changelog.py --extract "${VERSION}" > release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Voyager OGM v${{ needs.verify.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          # Only the highest v* tag may become "Latest"; a patch on an older
          # maintenance line must not replace a newer minor release.
          make_latest: ${{ needs.verify.outputs.latest }}
          files: dist/*

  # =========================================================================
  # 5. TestPyPI Publish (Trusted Publishing, Every Tag)
  # =========================================================================
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [verify, release]
    if: vars.TESTPYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/voyager-ogm
    permissions:
      id-token: write
    steps:
      - name: Download voyager-ogm Artifacts for TestPyPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist/ogm
          merge-multiple: true

      - name: Download voyager-cli Artifacts for TestPyPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-wheels-*
          path: dist/cli
          merge-multiple: true

      - name: Publish voyager-ogm to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/ogm/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish voyager-cli to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/cli/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # =========================================================================
  # 6. PyPI Publish (Trusted Publishing, Stable Tags Only)
  # =========================================================================
  pypi-publish:
    name: Publish to PyPI
    needs: [verify, release]
    if: vars.PYPI_PUBLISH == 'true' && needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voyager-ogm
    permissions:
      id-token: write
    steps:
      - name: Download voyager-ogm Artifacts for PyPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist/ogm
          merge-multiple: true

      - name: Download voyager-cli Artifacts for PyPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-wheels-*
          path: dist/cli
          merge-multiple: true

      - name: Publish voyager-ogm to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/ogm/
          # Keep re-runs safe: an existing filename is skipped instead of failing.
          skip-existing: true

      - name: Publish voyager-cli to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/cli/
          # Keep re-runs safe: an existing filename is skipped instead of failing.
          skip-existing: true

  # =========================================================================
  # 7. crates.io Publish (Trusted Publishing, Every Tag)
  # =========================================================================
  publish-crates:
    name: Publish to crates.io
    needs: [verify, release]
    if: vars.CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/voyager-ogm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish Crates in Dependency Order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          VERSION=$(python3 -c "
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))
          print(data['workspace']['package']['version'])
          ")
          USER_AGENT="voyager-release (github.com/tanishq-kumar/voyager)"

          crate_exists() {
            curl -fsS --retry 3 -A "${USER_AGENT}" \
              "https://crates.io/api/v1/crates/$1/${VERSION}" >/dev/null
          }

          wait_for_crate() {
            for _ in $(seq 1 60); do
              if crate_exists "$1"; then
                echo "$1 ${VERSION} is visible on the crates.io index."
                return 0
              fi
              sleep 5
            done
            echo "::warning::$1 ${VERSION} is not visible on the crates.io index yet; continuing."
          }

          for crate in voyager-ogm voyager-drivers voyager-cli; do
            if crate_exists "${crate}"; then
              echo "::notice::${crate} ${VERSION} is already published; skipping."
              continue
            fi
            echo "Publishing ${crate} ${VERSION}..."
            cargo publish -p "${crate}" --locked
            # Dependent crates need the newly published version in the index.
            wait_for_crate "${crate}"
          done
