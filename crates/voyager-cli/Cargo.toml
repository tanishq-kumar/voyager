[package]
name = "voyager-cli"
description = "Command-line interface for Voyager OGM (the `voyager` and `voy` binaries)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "graph", "cypher", "database", "ogm"]
categories = ["command-line-utilities", "database"]
readme = "README.md"
default-run = "voyager"

[[bin]]
name = "voyager"
path = "src/main.rs"

[[bin]]
name = "voy"
path = "src/bin/voy.rs"

[lints]
workspace = true

[features]
default = ["bolt", "postgres", "redis", "tls"]
bolt = ["voyager-drivers/bolt"]
postgres = ["voyager-drivers/postgres"]
redis = ["voyager-drivers/redis"]
# TLS connections (bolt+s, rediss, PostgreSQL sslmode) for `voyager doctor --uri`
tls = ["voyager-drivers/tls"]

[dependencies]
voyager-ogm = { workspace = true, features = ["serde", "arrow"] }
voyager-drivers = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
