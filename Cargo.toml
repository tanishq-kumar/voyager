[workspace]
resolver = "2"
members = [
    "crates/voyager-ogm",
    "crates/voyager-cli",
    "crates/voyager-pyo3",
    "crates/voyager-drivers",
]
exclude = [
    "fuzz",
]

[workspace.lints.clippy]
large_enum_variant = "warn"

[workspace.package]
version = "0.5.0-alpha.2"
edition = "2024"
rust-version = "1.87.0"
authors = ["Tanishq Kumar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tanishq-kumar/voyager"

[workspace.dependencies]
# Internal workspace crates
voyager-ogm = { path = "crates/voyager-ogm", version = "0.5.0-alpha.2" }
# default-features = false here, so a member can choose its own protocols
# (an inherited dependency cannot turn its defaults off).
voyager-drivers = { path = "crates/voyager-drivers", version = "0.5.0-alpha.2", default-features = false }

# Asynchronous Network Runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
bytes = "1.9"
parking_lot = "0.12"
url = "2.5"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
arrow-schema = "57.3"
# chrono-tz lets us validate timestamp zone ids with the same parser Arrow/Polars
# use, instead of consulting the host's /usr/share/zoneinfo (absent on Windows).
arrow-array = { version = "57.3", features = ["chrono-tz"] }
arrow-buffer = "57.3"
arrow-select = "57.3"

# Cryptography & Auth (PostgreSQL MD5 & SCRAM-SHA-256)
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
getrandom = "0.3"

# TLS (voyager-drivers `tls` feature): rustls with the ring provider, so no
# aws-lc-rs / cmake toolchain is needed; roots come from the operating system store.
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

# CLI & Diagnostics
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
tracing = "0.1"

# Testing & Benchmarking
insta = { version = "1.41", features = ["json", "yaml"] }
criterion = { version = "0.5", features = ["html_reports"] }

# Python FFI
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "generate-import-lib"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

[profile.dev]
# Line tables only: preserves stack trace file:line locations while reducing .pdb sizes by ~75%
debug = 1
# Workspace crates: unoptimised for fast, cheap incremental rebuilds (the code you edit)
opt-level = 0

# Dependencies (polars, arrow, tokio, ...): optimised once, then served from sccache
[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: backtraces keep file:line for workspace crates,
# while target/ shrinks by ~30% (991 MB -> 694 MB for a clean debug build).
debug = false

# Deep-recursion parsers need frame reuse to stay inside 1-2 MB stacks
[profile.dev.package.voyager-ogm]
opt-level = 1

[profile.dev.package.voyager-drivers]
opt-level = 1

[profile.dev.package.voyager-pyo3]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic = "abort" removed: in a PyO3 extension a Rust panic must unwind so it surfaces
# as a catchable Python PanicException instead of killing the interpreter.
strip = true

[profile.bench]
opt-level = 3
debug = true
lto = "thin"
